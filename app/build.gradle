plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yerin.albumsorter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yerin.albumsorter'
        minSdk 30          // 안드로이드 11 이상
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
